<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob:; frame-src about:; style-src 'unsafe-inline'; img-src data: blob:; form-action 'none'"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block;background:white}</style></head><body><script>
// This document runs in an opaque-origin sandbox, separately from the app.
let worker;
addEventListener('message', event => {
  if (event.source !== parent) return;
  if (event.data?.type === 'run') {
    worker?.terminate();
    worker = new Worker(URL.createObjectURL(new Blob([event.data.code], {type:'application/javascript'})));
    worker.onmessage = value => parent.postMessage(value.data, '*');
    worker.onerror = error => parent.postMessage({source:'openstarry-run',type:'error',text:error.message}, '*');
  }
  if (event.data?.type === 'preview') {
    document.open(); document.write(event.data.html); document.close();
  }
});
parent.postMessage({source:'openstarry-runtime',type:'ready',id:document.body.dataset.handshake || location.hash.slice(1)}, '*');
</script></body></html>
