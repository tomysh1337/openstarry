name: Release Electron Client

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: CLIENT/openstarry-app/package-lock.json

      - name: Install shared IDE dependencies
        working-directory: SHARED/workbench
        run: npm ci

      - name: Install dependencies
        working-directory: CLIENT/openstarry-app
        run: npm ci

      - name: Build & package Electron app
        working-directory: CLIENT/openstarry-app
        run: npm run build:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip macOS code-signing lookup. Code signing can be enabled later
          # by setting APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, etc.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: CLIENT/openstarry-app/dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
